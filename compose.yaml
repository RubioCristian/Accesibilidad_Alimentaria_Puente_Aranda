# Podman Compose / Docker Compose.  Uso:
#   podman compose up -d db web      # base de datos (5433) y visor (8080)
#   podman compose run --rm etl      # scripts SQL + cargas + exportacion al visor
name: accesibilidad-alimentaria

services:
  db:
    build:
      context: ./docker/db
      dockerfile: Containerfile
    image: localhost/alimentos-pa-db:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: alimentos_puente_aranda
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro,Z
      - ./Backup:/backup:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alimentos_puente_aranda"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: docker.io/library/nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./SIG:/usr/share/nginx/html:ro,Z
      - ./docker/web/default.conf:/etc/nginx/conf.d/default.conf:ro,Z

  etl:
    build:
      context: ./docker/etl
      dockerfile: Containerfile
    image: localhost/alimentos-pa-etl:1
    profiles: ["etl"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: alimentos_puente_aranda
      CODE_VERSION: ${CODE_VERSION:-sin-version}
    volumes:
      - ./Scripts:/app/Scripts:ro,Z
      - ./SIG:/app/SIG:Z
      - ./Backup:/app/Backup:Z
      - cache:/cache

volumes:
  pgdata:
  cache:
